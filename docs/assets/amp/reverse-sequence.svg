<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="640" viewBox="0 0 1480 640" role="img" aria-labelledby="title"><title id="title">反向 reverse：Linux 先触发，Core3 再提问</title><rect width="100%" height="100%" fill="#ffffff"/><text x="45" y="62" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#14263f" text-anchor="start">反向 reverse：Linux 先触发，Core3 再提问</text><rect x="65" y="110" width="390" height="65" rx="16" fill="#eaf3ff" stroke="#91b6df" stroke-width="2"/><text x="260" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#2262aa" text-anchor="middle">Linux 测试程序（经驱动）</text><rect x="1025" y="110" width="390" height="65" rx="16" fill="#e9f6ef" stroke="#8bbda7" stroke-width="2"/><text x="1220" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#18816b" text-anchor="middle">Core3 裸机程序</text><line x1="260" y1="175" x2="260" y2="580" stroke="#c8d5e2" stroke-width="3" stroke-dasharray="8 7"/><line x1="1220" y1="175" x2="1220" y2="580" stroke="#c8d5e2" stroke-width="3" stroke-dasharray="8 7"/><text x="740" y="235" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2262aa" text-anchor="middle">1  ARM_REVERSE：Linux 触发反向事务</text><line x1="260" y1="250" x2="1220" y2="250" stroke="#2262aa" stroke-width="3"/><polygon points="1220,250 1207,244 1207,256" fill="#2262aa"/><text x="740" y="325" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#18816b" text-anchor="middle">2  ECHO_REQ：Core3 生成数据请求</text><line x1="1220" y1="340" x2="260" y2="340" stroke="#18816b" stroke-width="3"/><polygon points="260,340 273,346 273,334" fill="#18816b"/><text x="740" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2262aa" text-anchor="middle">3  ECHO_RESP：Linux 核对并回传</text><line x1="260" y1="430" x2="1220" y2="430" stroke="#2262aa" stroke-width="3"/><polygon points="1220,430 1207,424 1207,436" fill="#2262aa"/><text x="740" y="505" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#18816b" text-anchor="middle">4  READY：Core3 确认本事务完成</text><line x1="1220" y1="520" x2="260" y2="520" stroke="#18816b" stroke-width="3"/><polygon points="260,520 273,526 273,514" fill="#18816b"/><text x="45" y="619" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#52657d" text-anchor="start">箭头表示协议消息帧，实际经板内两个共享内存槽搬运；每次运行测试前还会进行 HELLO / READY 握手。</text></svg>
