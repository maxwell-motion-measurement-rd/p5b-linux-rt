<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1010" viewBox="0 0 1480 1010" role="img" aria-labelledby="title"><title id="title">Linux 与 Core3：程序、内存与通信路径</title><rect width="100%" height="100%" fill="#ffffff"/><text x="46" y="62" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#14263f" text-anchor="start">Linux 与 Core3：程序、内存与通信路径</text><rect x="40" y="95" width="1400" height="86" rx="16" fill="#eef3f8" stroke="#c8d5e2" stroke-width="2"/><text x="65" y="142" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#14263f" text-anchor="start">Windows 电脑</text><text x="300" y="144" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14263f" text-anchor="start">保存 Release 文件；通过 USB 串口上传、输入命令、查看输出</text><line x1="470" y1="181" x2="470" y2="253" stroke="#52657d" stroke-width="3"/><polygon points="470,253 476,240 464,240" fill="#52657d"/><text x="495" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#52657d" text-anchor="start">USB 串口（电脑 ↔ 板子）</text><rect x="40" y="255" width="1400" height="715" rx="16" fill="#f8fafc" stroke="#c8d5e2" stroke-width="2"/><text x="65" y="296" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#14263f" text-anchor="start">P5 板 · 四个 A53 核 + DDR 内存</text><rect x="70" y="325" width="820" height="390" rx="16" fill="#eaf3ff" stroke="#91b6df" stroke-width="2"/><text x="95" y="367" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2262aa" text-anchor="start">Linux 系统 · CPU0—2</text><rect x="95" y="405" width="290" height="96" rx="16" fill="#ffffff" stroke="#91b6df" stroke-width="2"/><text x="115" y="448" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2262aa" text-anchor="start">g5_test</text><text x="115" y="484" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#14263f" text-anchor="start">Linux 用户态测试进程</text><rect x="435" y="405" width="430" height="96" rx="16" fill="#ffffff" stroke="#91b6df" stroke-width="2"/><text x="455" y="443" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#14263f" text-anchor="start">Linux 文件系统中的文件</text><text x="455" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#14263f" text-anchor="start">/tmp/amp-r004/  ·  .ko / .bin / 工具</text><text x="455" y="496" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#14263f" text-anchor="start">固件另复制到 /lib/firmware/</text><line x1="240" y1="501" x2="240" y2="575" stroke="#2262aa" stroke-width="3"/><polygon points="240,575 246,562 234,562" fill="#2262aa"/><text x="260" y="542" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#2262aa" text-anchor="start">open / write / read</text><rect x="95" y="575" width="290" height="75" rx="16" fill="#ffffff" stroke="#91b6df" stroke-width="2"/><text x="115" y="616" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2262aa" text-anchor="start">/dev/p5-core3</text><text x="115" y="643" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#14263f" text-anchor="start">设备访问入口</text><line x1="385" y1="613" x2="435" y2="613" stroke="#2262aa" stroke-width="3"/><polygon points="435,613 422,607 422,619" fill="#2262aa"/><rect x="435" y="575" width="430" height="75" rx="16" fill="#dbeaff" stroke="#91b6df" stroke-width="2"/><text x="454" y="610" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#2262aa" text-anchor="start">p5_core3_comm.ko → 已加载驱动</text><text x="454" y="642" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#14263f" text-anchor="start">运行于 Linux 内核空间</text><line x1="650" y1="501" x2="650" y2="575" stroke="#52657d" stroke-width="3"/><polygon points="650,575 656,562 644,562" fill="#52657d"/><text x="668" y="544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">insmod 加载 .ko</text><text x="95" y="698" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#14263f" text-anchor="start">向 start 写入 1：装入 .bin 到私有 DDR，再请求唤醒 Core3</text><rect x="940" y="325" width="470" height="390" rx="16" fill="#e9f6ef" stroke="#8bbda7" stroke-width="2"/><text x="965" y="366" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#18816b" text-anchor="start">独立 Core3 · 不由 Linux 调度</text><rect x="965" y="405" width="420" height="115" rx="16" fill="#ffffff" stroke="#8bbda7" stroke-width="2"/><text x="985" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#18816b" text-anchor="start">执行 p5-core3-comm.bin 中的程序</text><text x="985" y="482" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#14263f" text-anchor="start">初始化 → 轮询消息 → 回应 → 心跳</text><text x="985" y="511" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">CPU 执行指令；代码保存在 DDR</text><rect x="965" y="555" width="420" height="100" rx="16" fill="#d8ede1" stroke="#8bbda7" stroke-width="2"/><text x="985" y="595" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#18816b" text-anchor="start">Core3 私有 DDR · 预留 2 MiB</text><text x="985" y="631" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#14263f" text-anchor="start">起始 / 代码入口：0x60000000</text><line x1="1175" y1="555" x2="1175" y2="520" stroke="#18816b" stroke-width="3"/><polygon points="1175,520 1169,533 1181,533" fill="#18816b"/><rect x="145" y="805" width="1190" height="120" rx="16" fill="#fff2df" stroke="#d9b074" stroke-width="2"/><text x="170" y="844" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#a95d16" text-anchor="start">共享 DDR · 0x60200000 起 · 预留 2 MiB</text><rect x="170" y="865" width="550" height="42" rx="7" fill="#ffffff" stroke="#d9b074" stroke-width="2"/><text x="185" y="891" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#a95d16" text-anchor="start">Linux → Core3 消息槽 · 0x60201000</text><rect x="755" y="865" width="550" height="42" rx="7" fill="#ffffff" stroke="#d9b074" stroke-width="2"/><text x="770" y="891" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#a95d16" text-anchor="start">Core3 → Linux 消息槽 · 0x60202000</text><line x1="650" y1="650" x2="650" y2="805" stroke="#2262aa" stroke-width="3"/><polygon points="650,805 656,792 644,792" fill="#2262aa"/><line x1="620" y1="805" x2="620" y2="715" stroke="#2262aa" stroke-width="3"/><polygon points="620,715 614,728 626,728" fill="#2262aa"/><text x="410" y="770" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#2262aa" text-anchor="start">驱动读写 / 轮询</text><line x1="1175" y1="715" x2="1175" y2="805" stroke="#18816b" stroke-width="3"/><polygon points="1175,805 1181,792 1169,792" fill="#18816b"/><line x1="1145" y1="805" x2="1145" y2="715" stroke="#18816b" stroke-width="3"/><polygon points="1145,715 1139,728 1151,728" fill="#18816b"/><text x="960" y="770" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#18816b" text-anchor="start">裸机读写 / 轮询</text><text x="60" y="993" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">位置示意，非按比例内存图；用户态进程和内核驱动的内存由 Linux 管理，无固定物理地址。</text></svg>
