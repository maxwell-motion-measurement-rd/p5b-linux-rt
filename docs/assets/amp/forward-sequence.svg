<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="430" viewBox="0 0 1480 430" role="img" aria-labelledby="title"><title id="title">正向 forward：一笔事务，两帧</title><rect width="100%" height="100%" fill="#ffffff"/><text x="45" y="62" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#14263f" text-anchor="start">正向 forward：一笔事务，两帧</text><rect x="65" y="110" width="390" height="65" rx="16" fill="#eaf3ff" stroke="#91b6df" stroke-width="2"/><text x="260" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#2262aa" text-anchor="middle">Linux 测试程序（经驱动）</text><rect x="1025" y="110" width="390" height="65" rx="16" fill="#e9f6ef" stroke="#8bbda7" stroke-width="2"/><text x="1220" y="151" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#18816b" text-anchor="middle">Core3 裸机程序</text><line x1="260" y1="175" x2="260" y2="370" stroke="#c8d5e2" stroke-width="3" stroke-dasharray="8 7"/><line x1="1220" y1="175" x2="1220" y2="370" stroke="#c8d5e2" stroke-width="3" stroke-dasharray="8 7"/><text x="740" y="235" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2262aa" text-anchor="middle">1  ECHO_REQ：Linux 发测试数据</text><line x1="260" y1="250" x2="1220" y2="250" stroke="#2262aa" stroke-width="3"/><polygon points="1220,250 1207,244 1207,256" fill="#2262aa"/><text x="740" y="325" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#18816b" text-anchor="middle">2  ECHO_RESP：Core3 原样返回</text><line x1="1220" y1="340" x2="260" y2="340" stroke="#18816b" stroke-width="3"/><polygon points="260,340 273,346 273,334" fill="#18816b"/><text x="45" y="409" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#52657d" text-anchor="start">箭头表示协议消息帧，实际经板内两个共享内存槽搬运；每次运行测试前还会进行 HELLO / READY 握手。</text></svg>
